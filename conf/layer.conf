# mangOH specific variables go here
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mangoh"
BBFILE_PATTERN_mangoh := "^${LAYERDIR}/"
BBFILE_PRIORITY_mangoh = "40"

# Sierra Wireless WP77xx/WP76xx Release 15 (Linux SWI9X06Y_03.00.x): Yocto 3.1 and kernel 4.14
LAYERSERIES_COMPAT_mangoh = "dunfell"
